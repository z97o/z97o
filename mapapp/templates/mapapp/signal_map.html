<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Omantel — Muscat Signal Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <style>
    body { background: #fdf8f2; font-family: sans-serif; text-align:center; }
    #map { height: 500px; width: 90%; margin: 1rem auto; border-radius: 15px; }
  </style>
</head>
<body>
  <h3>Omantel — Muscat Signal Map</h3>
  <div id="map"></div>

  <script>
    var map = L.map('map').setView([23.6, 58.5], 8);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18
    }).addTo(map);
  </script>
</body>
</html>
