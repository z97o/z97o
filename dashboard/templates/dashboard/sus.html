<!-- dashboard/templates/dashboard/sus.html -->
{% extends 'dashboard/base.html' %}
{% block content %}
<h3 style="color:#9A7E55;">System Usability Scale (SUS)</h3>
<form id="susForm">
  <!-- Ten 1–5 Likert questions (placeholder) -->
  <div class="row">
    {% for i in "12345678910"|make_list %}
    <div class="col-12 mb-2">
      <label>Question {{ forloop.counter }}</label>
      <select name="q{{ forloop.counter }}" class="form-select">
        <option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option>
      </select>
    </div>
    {% endfor %}
  </div>
  <button class="btn btn-primary" type="submit">Submit</button>
</form>
<div id="susResult" class="mt-3"></div>
<script>
document.getElementById('susForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const fd = new FormData(e.target);
  const r = await fetch("{% url 'dashboard:api_feedback_sus' %}", {method:"POST", body:fd});
  const d = await r.json();
  document.getElementById('susResult').innerHTML =
    `SUS Score: <b>${d.sus.toFixed(1)}</b> — ${d.meets_80 ? '✅ Meets ≥80%' : '❌ Below 80%'}`;
});
</script>
{% endblock %}
